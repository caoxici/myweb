<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>成员介绍 · Vaughn.C LAB</title>
    <link rel="icon" type="image/jpeg" href="/website.jpg">
    <!-- 引入优雅衬线字体 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #eef2f7;
            font-family: 'Noto Serif SC', '宋体', 'SimSun', 'Georgia', serif;
            color: #1e2f3c;
            line-height: 1.7;
            padding: 2.5rem 1.5rem;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 尊贵金点缀 */
        :root {
            --gold: #c9a96e;
            --gold-light: #f0e4c6;
            --dark-blue: #0a1e2e;
            --deep-blue: #132b42;
        }

        .person-wrapper {
            width: 100%;
            max-width: 1100px;
            background: transparent;
            border-radius: 28px;
            overflow: hidden;
        }

        /* 顶部英雄区 */
        .person-hero {
            background: linear-gradient(135deg, #09151f 0%, #0f2538 50%, #142c44 100%);
            padding: 3.5rem 3rem 2.8rem;
            color: white;
            border-radius: 24px 24px 0 0;
            position: relative;
            overflow: hidden;
        }

        .person-hero::before {
            content: "";
            position: absolute;
            top: -50%;
            right: -20%;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(201,169,110,0.15) 0%, transparent 70%);
            pointer-events: none;
        }

        .person-hero::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 2.5rem;
            right: 2.5rem;
            height: 2px;
            background: linear-gradient(90deg, var(--gold), #e0d5b7, transparent);
            opacity: 0.7;
        }

        .person-hero .watermark-link {
            position: absolute;
            top: 1.5rem;
            right: 2rem;
            color: #d3e6ff;
            border: 1px solid rgba(255,255,255,0.25);
            padding: 0.35rem 1.2rem;
            border-radius: 25px;
            font-size: 0.9rem;
            text-decoration: none;
            transition: all 0.25s;
            font-family: 'Segoe UI', sans-serif;
            z-index: 10;
        }
        .person-hero .watermark-link:hover {
            background: rgba(255,255,255,0.08);
            color: #fff;
            border-color: rgba(255,255,255,0.5);
        }

        .person-name {
            font-size: 3.8rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: #fff;
            text-shadow: 0 2px 10px rgba(0,0,0,0.4);
            margin-bottom: 0.5rem;
            position: relative;
        }

        .person-title {
            font-size: 1.5rem;
            font-weight: 400;
            color: #e0d5b7;
            margin-bottom: 0.8rem;
            border-left: 4px solid var(--gold);
            padding-left: 1.2rem;
            letter-spacing: 1px;
        }

        .person-date {
            font-size: 1rem;
            color: #b0cde0;
            margin-top: 0.5rem;
            font-family: 'Segoe UI', sans-serif;
        }

        /* 内容卡片容器 */
        .person-content {
            background: #ffffff;
            padding: 3rem 3.5rem 2.5rem;
            border-radius: 0 0 24px 24px;
            box-shadow: 0 10px 25px rgba(0, 20, 40, 0.06);
            border: 1px solid #e0eaf3;
            border-top: none;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 2.5rem;
            color: #2a6a9c;
            text-decoration: none;
            font-size: 1rem;
            border-bottom: 1px dotted #7aa5c2;
            font-family: 'Segoe UI', sans-serif;
            transition: color 0.2s;
        }
        .back-link:hover {
            color: #0a3147;
            border-bottom-color: #1f6eb0;
        }

        /* 区块设计 */
        .block {
            margin-bottom: 3rem;
            position: relative;
        }

        .block-title {
            font-size: 1.9rem;
            font-weight: 600;
            color: #132b42;
            margin-bottom: 1.5rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid #dbe3ec;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .block-title::before {
            content: "";
            width: 6px;
            height: 30px;
            background: var(--gold);
            border-radius: 3px;
            margin-right: 0.5rem;
        }

        .block p {
            color: #2c4053;
            margin-bottom: 1rem;
            text-align: justify;
        }

        /* 时间线 */
        .timeline {
            list-style: none;
            padding-left: 0;
            margin-top: 0.5rem;
        }
        .timeline li {
            position: relative;
            padding-left: 2.3rem;
            margin-bottom: 1.2rem;
            border-left: 2px solid #cbd5e0;
        }
        .timeline li::before {
            content: "";
            position: absolute;
            left: -7px;
            top: 0.3rem;
            width: 12px;
            height: 12px;
            background: var(--gold);
            border-radius: 50%;
            box-shadow: 0 0 0 3px #f8f6f0;
        }

        /* 联系方式卡片 */
        .contact-card {
            background: #f8f9fb;
            border-left: 4px solid var(--gold);
            border-radius: 8px;
            padding: 1.5rem 2rem;
            margin-top: 0.5rem;
            line-height: 2;
            font-size: 1rem;
            color: #1e2f3c;
        }
        .contact-card a {
            color: #1f5b8c;
            text-decoration: none;
            border-bottom: 1px dotted #a0bedb;
        }
        .contact-card a:hover {
            color: #0a3147;
        }

        /* 作者链接按钮 */
        .author-link-btn {
            display: inline-block;
            background: linear-gradient(135deg, #2b4b6b, #1a3650);
            color: #fff;
            padding: 0.6rem 2rem;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 500;
            letter-spacing: 0.5px;
            transition: all 0.3s;
            border: 1px solid var(--gold);
            font-family: 'Segoe UI', sans-serif;
        }
        .author-link-btn:hover {
            background: linear-gradient(135deg, #3b5f82, #244b66);
            border-color: #dbbf6c;
        }

        @media (max-width: 700px) {
            body {
                padding: 1.2rem 0.8rem;
            }
            .person-hero {
                padding: 2.3rem 1.5rem 2rem;
            }
            .person-name {
                font-size: 2.6rem;
            }
            .person-title {
                font-size: 1.2rem;
            }
            .person-content {
                padding: 2rem 1.5rem;
            }
            .block-title {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
<div class="person-wrapper">
    <header class="person-hero" id="person-hero">
        <a href="/digital-watermark.html" class="watermark-link">暗水印工具（专业版）</a>
        <h1 class="person-name" id="person-name">加载中…</h1>
        <div class="person-title" id="person-title"></div>
        <div class="person-date" id="person-date"></div>
    </header>

    <div class="person-content">
        <a href="/" class="back-link">← 返回首页</a>
        <div id="person-details">
            <div style="text-align:center; padding:2rem; color:#7a8c9e;">⏳ 正在加载人物履历…</div>
        </div>
    </div>
</div>

<script>
    (function(){
        const params = new URLSearchParams(window.location.search);
        const file = params.get('file');
        if (!file) {
            document.getElementById('person-name').textContent = '错误';
            document.getElementById('person-details').innerHTML = '<p>未指定人员文件</p>';
            return;
        }
        const fileUrl = `/person/${file}`;

        function esc(t) {
            return String(t).replace(/[&<>"']/g, m => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
            }[m]));
        }

        function parsePerson(md) {
            const lines = md.split('\n');
            let name = '', title = '', date = '';
            if (lines.length > 0) name = lines[0].trim();
            if (lines.length > 1) title = lines[1].trim();
            if (lines.length > 2) date = lines[2].trim();
            let start = 3;
            while (start < lines.length && lines[start].trim() === '') start++;
            const body = lines.slice(start).join('\n');

            const sections = { intro: '', timeline: [], note: '', author: '', contact: '' };
            const parts = body.split(/^##\s+/m);
            for (let i = 1; i < parts.length; i++) {
                const part = parts[i];
                const br = part.indexOf('\n');
                const heading = part.substring(0, br).trim();
                const content = part.substring(br + 1).trim();

                if (heading.includes('人物介绍')) sections.intro = content;
                else if (heading.includes('任职履历')) {
                    sections.timeline = content.split('\n')
                        .filter(l => l.trim().startsWith('-'))
                        .map(l => l.replace(/^-\s*/, '').trim());
                }
                else if (heading.includes('个人说明')) sections.note = content;
                else if (heading.includes('作者主页')) sections.author = content.trim();
                else if (heading.includes('联系方式')) sections.contact = content;
            }
            return { name, title, date, sections };
        }

        function render(data) {
            document.getElementById('person-name').textContent = data.name;
            document.getElementById('person-title').textContent = data.title;
            document.getElementById('person-date').textContent = `📅 更新于 ${data.date}`;
            document.title = `${data.name} · Vaughn.C LAB`;

            const s = data.sections;
            let html = '';

            if (s.intro) {
                html += `<div class="block">
                    <div class="block-title">人物介绍</div>
                    <p>${esc(s.intro).replace(/\n/g, '<br>')}</p>
                </div>`;
            }
            if (s.timeline.length) {
                html += `<div class="block">
                    <div class="block-title">任职履历</div>
                    <ul class="timeline">
                        ${s.timeline.map(item => `<li>${esc(item)}</li>`).join('')}
                    </ul>
                </div>`;
            }
            if (s.note) {
                html += `<div class="block">
                    <div class="block-title">个人说明</div>
                    <p>${esc(s.note).replace(/\n/g, '<br>')}</p>
                </div>`;
            }
            if (s.author) {
                html += `<div class="block">
                    <div class="block-title">作者主页</div>
                    <a href="/author.html?name=${encodeURIComponent(s.author)}" class="author-link-btn">
                        查看 ${esc(s.author)} 的全部文章 →
                    </a>
                </div>`;
            }
            if (s.contact) {
                html += `<div class="block">
                    <div class="block-title">联系方式</div>
                    <div class="contact-card">${esc(s.contact).replace(/\n/g, '<br>')}</div>
                </div>`;
            }

            document.getElementById('person-details').innerHTML = html || '<p style="text-align:center; color:#7a8c9e;">暂无详细资料。</p>';
        }

        async function load() {
            try {
                const res = await fetch(fileUrl);
                if (!res.ok) throw new Error('文件加载失败');
                const md = await res.text();
                const data = parsePerson(md);
                render(data);
            } catch (e) {
                document.getElementById('person-name').textContent = '加载失败';
                document.getElementById('person-details').innerHTML = `<p style="color:#a94442;">⚠️ ${e.message}</p>`;
            }
        }
        load();
    })();
</script>
</body>
</html>
