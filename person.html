<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>成员介绍 · Vaughn.C LAB</title>
    <link rel="icon" type="image/jpeg" href="/website.jpg">
    <link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="container">
    <header class="hero" id="person-hero">
        <a href="/digital-watermark.html" class="watermark-link">暗水印工具（专业版）</a>
        <h1 id="person-name">加载中…</h1>
        <div class="subhead" id="person-title"></div>
        <div class="subhead" id="person-date" style="font-size:0.95rem; color:#b0cde0; margin-top:0.3rem;"></div>
    </header>
    <div class="content">
        <a href="/" class="back-link">← 返回首页</a>
        <div id="person-content"><div class="status-box">⏳ 加载中…</div></div>
    </div>
</div>
<script>
    (function(){
        const params = new URLSearchParams(window.location.search);
        const file = params.get('file');
        if(!file){ document.getElementById('person-name').textContent='错误'; return; }
        const fileUrl = `/person/${file}`;
        function esc(t){ return String(t).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m])); }
        function parsePerson(md){
            const lines = md.split('\n');
            let name='', title='', date='';
            if(lines.length>0) name=lines[0].trim();
            if(lines.length>1) title=lines[1].trim();
            if(lines.length>2) date=lines[2].trim();
            let start=3; while(start<lines.length && lines[start].trim()==='') start++;
            const body = lines.slice(start).join('\n');
            const sections = {intro:'',timeline:[],note:'',author:''};
            const parts = body.split(/^##\s+/m);
            for(let i=1;i<parts.length;i++){
                const part=parts[i];
                const br = part.indexOf('\n');
                const heading = part.substring(0,br).trim();
                const content = part.substring(br+1).trim();
                if(heading.includes('人物介绍')) sections.intro=content;
                else if(heading.includes('任职履历')) sections.timeline=content.split('\n').filter(l=>l.trim().startsWith('-')).map(l=>l.replace(/^-\s*/,'').trim());
                else if(heading.includes('个人说明')) sections.note=content;
                else if(heading.includes('作者主页')) sections.author=content.trim();
            }
            return {name,title,date,sections};
        }
        async function load(){
            try{
                const r = await fetch(fileUrl);
                const md = await r.text();
                const d = parsePerson(md);
                document.getElementById('person-name').textContent = d.name;
                document.getElementById('person-title').textContent = d.title;
                document.getElementById('person-date').textContent = `📅 更新于 ${d.date}`;
                document.title = `${d.name} · Vaughn.C LAB`;
                let html='';
                const s = d.sections;
                if(s.intro) html+=`<section class="section" style="margin-bottom:2.5rem;"><h2 style="font-size:1.8rem; color:#1c405b; border-bottom:1px solid #cbdde9; padding-bottom:0.3rem; margin-bottom:1.2rem;">📖 人物介绍</h2><p>${esc(s.intro).replace(/\n/g,'<br>')}</p></section>`;
                if(s.timeline.length){
                    html+=`<section class="section" style="margin-bottom:2.5rem;"><h2 style="font-size:1.8rem; color:#1c405b; border-bottom:1px solid #cbdde9;">⏳ 任职履历</h2><ul class="timeline">`;
                    s.timeline.forEach(item=>html+=`<li>${esc(item)}</li>`);
                    html+=`</ul></section>`;
                }
                if(s.note) html+=`<section class="section" style="margin-bottom:2.5rem;"><h2 style="font-size:1.8rem; color:#1c405b; border-bottom:1px solid #cbdde9;">📝 个人说明</h2><p>${esc(s.note).replace(/\n/g,'<br>')}</p></section>`;
                if(s.author) html+=`<section class="section"><h2 style="font-size:1.8rem; color:#1c405b; border-bottom:1px solid #cbdde9;">🔗 作者主页</h2><a href="/author.html?name=${encodeURIComponent(s.author)}" class="tag-link" style="padding:0.3rem 1.2rem;">查看 ${esc(s.author)} 的全部文章 →</a></section>`;
                document.getElementById('person-content').innerHTML = html || '<p>暂无详细介绍。</p>';
            }catch(e){ document.getElementById('person-name').textContent='加载失败'; }
        }
        load();
    })();
</script>
</body>
</html>
