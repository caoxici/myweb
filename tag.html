<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>标签 · Vaughn.C LAB</title>
    <link rel="icon" type="image/jpeg" href="/website.jpg">
    <link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="container">
    <header class="hero">
        <a href="/digital-watermark.html" class="watermark-link">暗水印工具（专业版）</a>
        <h1 id="tag-title">🏷️ 标签</h1>
        <div class="subhead">Vaughn.C LAB · 相关文章</div>
    </header>
    <div class="content">
        <a href="/" class="back-link">← 返回首页</a>
        <div id="tag-container" class="article-list"><div class="status-box">⏳ 加载中…</div></div>
    </div>
</div>
<script>
    (function(){
        const cont = document.getElementById('tag-container');
        const titleEl = document.getElementById('tag-title');
        const params = new URLSearchParams(window.location.search);
        const target = params.get('tag') ? decodeURIComponent(params.get('tag')).trim() : '';
        if(!target){ titleEl.textContent='未指定标签'; cont.innerHTML='<div class="status-box">请通过标签链接访问</div>'; return; }
        titleEl.textContent = `🏷️ ${target} · 相关文章`;
        function esc(t){ return String(t).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m])); }
        function fmtDate(d){ if(!d) return ''; const p=d.split('-'); return p.length===3?`${p[0]}年${+p[1]}月${+p[2]}日`:d; }
        function fmtAuthors(a){ if(!a) return '未知作者'; return a.split(',').map(s=>`<a href="/author.html?name=${encodeURIComponent(s.trim())}" class="author-link">${esc(s.trim())}</a>`).join(', '); }
        function fmtTags(t,curr){ if(!t||!Array.isArray(t)) return ''; return t.map(tag=>`<span class="tag-link" style="${tag===curr?'background:#b3cee5;font-weight:600;':''}">#${esc(tag)}</span>`).join(''); }
        async function load(){
            try{
                const r = await fetch('/posts.json?t='+Date.now());
                const d = await r.json();
                const filtered = d.filter(item=>{
                    const tags = item.tags || (item.tag?[item.tag]:[]);
                    return tags.includes(target);
                });
                const sorted = filtered.sort((a,b)=>(b.date||'').localeCompare(a.date||''));
                if(!sorted.length){ cont.innerHTML=`<div class="status-box">📭 暂无标签 “${target}” 的文章</div>`; return; }
                let html='';
                sorted.forEach(item=>{
                    const title=item.title||'无标题', date=fmtDate(item.date), filename=item.filename||'';
                    const url = filename ? `/article.html?post=${encodeURIComponent(filename)}` : '#';
                    const authors=fmtAuthors(item.author);
                    const tagsHtml=fmtTags(item.tags||[item.tag], target);
                    html+=`<article class="article-card"><div class="article-meta"><span class="article-date">📅 ${date}</span><span>✍️ ${authors}</span><div style="display:flex;flex-wrap:wrap;gap:0.2rem;">${tagsHtml}</div></div><h3 class="article-title"><a href="${esc(url)}" target="_blank">${esc(title)}</a></h3></article>`;
                });
                cont.innerHTML=html;
            }catch(e){ cont.innerHTML='<div class="status-box">⚠️ 加载失败</div>'; }
        }
        load();
    })();
</script>
</body>
</html>
