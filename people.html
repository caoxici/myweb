<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全部成员 · Vaughn.C LAB</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:#eef3f9; font-family:'Segoe UI','Roboto',sans-serif; color:#1a2e3f; line-height:1.6; padding:2rem 1.2rem; min-height:100vh; display:flex; flex-direction:column; align-items:center; }
        .container { width:100%; max-width:1300px; margin:0 auto; background:#fff; border-radius:24px; box-shadow:0 12px 30px rgba(0,20,50,0.08); overflow:hidden; border:1px solid #d9e6f5; flex:1; }
        .hero { background:linear-gradient(145deg,#0b1e2e,#1c3c5e,#234e77); padding:2.5rem 3rem; color:#fff; border-bottom:1px solid #2e577a; }
        .hero h1 { font-size:2.8rem; font-weight:500; font-family:'Georgia',serif; }
        .hero .subhead { font-size:1.2rem; color:#d3e6ff; margin-top:0.5rem; }
        .content { padding:2.5rem 2.8rem; }
        .back-link { display:inline-block; margin-bottom:2rem; color:#2a6a9c; text-decoration:none; border-bottom:1px dotted #7aa5c2; }
        .people-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(200px,1fr)); gap:1.5rem; }
        .person-card { background:#f9fcff; border-radius:12px; padding:1.2rem 1rem; border:1px solid #d9e6f5; text-align:center; }
        .person-name { font-size:1.1rem; font-weight:600; color:#0a3147; margin-bottom:0.3rem; }
        .person-name a { text-decoration:none; color:inherit; }
        .person-title { font-size:0.85rem; color:#4a789c; margin-bottom:0.6rem; }
        .person-summary { font-size:0.85rem; color:#2b445c; }
        .status-box { text-align:center; padding:3rem; color:#436684; }
    </style>
</head>
<body>
<div class="container">
    <header class="hero"><h1>👥 开发团队</h1><div class="subhead">Vaughn.C LAB · 全部成员</div></header>
    <div class="content">
        <a href="/" class="back-link">← 返回首页</a>
        <div id="people-grid" class="people-grid"><div class="status-box">⏳ 加载中…</div></div>
    </div>
</div>
<script>
    (function(){
        const grid = document.getElementById('people-grid');
        function esc(t){ return String(t).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m])); }
        async function load(){
            try{
                const r = await fetch('/person.json?t='+Date.now());
                const d = await r.json();
                if(!d.length){ grid.innerHTML='<div class="status-box">暂无成员</div>'; return; }
                let html='';
                d.forEach(p=>{
                    const name=p.name||'未知', title=p.title||'', summary=p.summary||'', filename=p.filename||'';
                    const url = filename ? `/person.html?file=${encodeURIComponent(filename)}` : '#';
                    html+=`<div class="person-card"><div class="person-name"><a href="${esc(url)}">${esc(name)}</a></div><div class="person-title">${esc(title)}</div><div class="person-summary">${esc(summary)}</div></div>`;
                });
                grid.innerHTML=html;
            }catch(e){ grid.innerHTML='<div class="status-box">⚠️ 加载失败</div>'; }
        }
        load();
    })();
</script>
</body>
</html>
