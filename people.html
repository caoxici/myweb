<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全部成员 · Vaughn.C LAB</title>
    <link rel="icon" type="image/jpeg" href="/website.jpg">
    <link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="container">
    <header class="hero">
        <a href="/digital-watermark.html" class="watermark-link">暗水印工具（专业版）</a>
        <h1>👥 开发团队</h1>
        <div class="subhead">Vaughn.C LAB · 全部成员</div>
    </header>
    <div class="content">
        <a href="/" class="back-link">← 返回首页</a>
        <div id="people-grid" class="people-grid"><div class="status-box">⏳ 加载中…</div></div>
    </div>
</div>
<script>
    (function(){
        const grid = document.getElementById('people-grid');
        function esc(t){ return String(t).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m])); }
        async function load(){
            try{
                const r = await fetch('/person.json?t='+Date.now());
                const d = await r.json();
                if(!d.length){ grid.innerHTML='<div class="status-box">暂无成员</div>'; return; }
                let html='';
                d.forEach(p=>{
                    const name=p.name||'未知', title=p.title||'', summary=p.summary||'', filename=p.filename||'';
                    const url = filename ? `/person.html?file=${encodeURIComponent(filename)}` : '#';
                    html+=`<div class="person-card"><div class="person-name"><a href="${esc(url)}">${esc(name)}</a></div><div class="person-title">${esc(title)}</div><div class="person-summary">${esc(summary)}</div></div>`;
                });
                grid.innerHTML=html;
            }catch(e){ grid.innerHTML='<div class="status-box">⚠️ 加载失败</div>'; }
        }
        load();
    })();
</script>
</body>
</html>
