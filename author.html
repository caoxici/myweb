<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>作者文章 · Vaughn.C LAB</title>
    <link rel="icon" type="image/jpeg" href="/website.jpg">
    <link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="container">
    <header class="hero">
        <a href="/digital-watermark.html" class="watermark-link">暗水印工具（专业版）</a>
        <h1 id="author-name-display">作者文章</h1>
        <div class="subhead">Vaughn.C LAB · 学术档案</div>
    </header>
    <div class="content">
        <a href="/" class="back-link">← 返回首页</a>
        <div id="author-container" class="article-list"><div class="status-box">⏳ 加载中…</div></div>
    </div>
</div>
<script>
    (function(){
        const cont = document.getElementById('author-container');
        const nameDisp = document.getElementById('author-name-display');
        const params = new URLSearchParams(window.location.search);
        const target = params.get('name') ? decodeURIComponent(params.get('name')).trim() : '';
        if(!target){ nameDisp.textContent='未指定作者'; cont.innerHTML='<div class="status-box">请通过作者链接访问</div>'; return; }
        nameDisp.textContent = `👤 ${target} 的文章`;
        function esc(t){ return String(t).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m])); }
        function fmtDate(d){ if(!d) return ''; const p=d.split('-'); return p.length===3?`${p[0]}年${+p[1]}月${+p[2]}日`:d; }
        function fmtTags(t){ if(!t||!Array.isArray(t)||!t.length) return ''; return t.map(tag=>`<a href="/tag.html?tag=${encodeURIComponent(tag)}" class="tag-link">#${esc(tag)}</a>`).join(''); }
        async function load(){
            try{
                const r = await fetch('/posts.json?t='+Date.now());
                const d = await r.json();
                const filtered = d.filter(item=>{
                    if(!item.author) return false;
                    return item.author.split(',').map(a=>a.trim()).includes(target);
                });
                const sorted = filtered.sort((a,b)=>(b.date||'').localeCompare(a.date||''));
                if(!sorted.length){ cont.innerHTML=`<div class="status-box">📭 ${target} 暂无文章</div>`; return; }
                let html='';
                sorted.forEach(item=>{
                    const title=item.title||'无标题', date=fmtDate(item.date), filename=item.filename||'';
                    const url = filename ? `/article.html?post=${encodeURIComponent(filename)}` : '#';
                    const tagsHtml=fmtTags(item.tags||(item.tag?[item.tag]:[]));
                    html+=`<article class="article-card"><div class="article-meta"><span class="article-date">📅 ${date}</span><div style="display:flex;flex-wrap:wrap;gap:0.2rem;">${tagsHtml}</div></div><h3 class="article-title"><a href="${esc(url)}" target="_blank">${esc(title)}</a></h3></article>`;
                });
                cont.innerHTML=html;
            }catch(e){ cont.innerHTML='<div class="status-box">⚠️ 加载失败</div>'; }
        }
        load();
    })();
</script>
</body>
</html>
