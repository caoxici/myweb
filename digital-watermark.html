<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StegaLoom Pro · 暗水印工坊</title>
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#080b14;--card:rgba(14,18,30,.88);--border:rgba(99,125,255,.1);
    --border-h:rgba(99,125,255,.3);--primary:#637dff;--pr-glow:rgba(99,125,255,.22);
    --accent:#60d0e8;--success:#4ade80;--danger:#f87171;
    --t1:#eef2ff;--t2:rgba(238,242,255,.5);--t3:rgba(238,242,255,.25);
    --r:16px;--rs:10px
  }
  body{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    background:var(--bg);color:var(--t1);min-height:100vh;overflow-x:hidden;
    background-image:radial-gradient(ellipse 70% 50% at 50% -10%,rgba(99,125,255,.055),transparent),radial-gradient(ellipse 50% 40% at 80% 85%,rgba(96,208,232,.035),transparent)
  }
  #particles{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
  .p{position:absolute;width:2px;height:2px;background:var(--primary);border-radius:50%;opacity:0;animation:flt linear infinite}
  @keyframes flt{0%{transform:translateY(100vh)scale(0);opacity:0}10%{opacity:.4}90%{opacity:.4}100%{transform:translateY(-5vh)scale(1);opacity:0}}
  .app{position:relative;z-index:1;max-width:960px;margin:0 auto;padding:28px 18px 40px}
  .header{text-align:center;padding:30px 0 28px;position:relative}
  .header::after{content:'';position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:100px;height:1px;background:linear-gradient(90deg,transparent,var(--primary),transparent)}
  .logo{display:inline-flex;align-items:center;gap:10px;margin-bottom:8px}
  .logo-i{width:40px;height:40px;background:linear-gradient(135deg,var(--primary),var(--accent));border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:0 6px 24px var(--pr-glow)}
  .logo-t{font-size:24px;font-weight:800;letter-spacing:-.3px;background:linear-gradient(135deg,#eef2ff,var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  .header p{color:var(--t2);font-size:13px;max-width:460px;margin:0 auto;line-height:1.5}
  .tb-wrap{display:flex;justify-content:center;margin:22px 0 18px}
  .tb{display:flex;gap:3px;background:rgba(255,255,255,.035);border:1px solid var(--border);border-radius:12px;padding:4px;backdrop-filter:blur(8px)}
  .tb-btn{position:relative;padding:10px 28px;border:none;background:transparent;color:var(--t3);font-family:inherit;font-size:13px;font-weight:500;cursor:pointer;border-radius:8px;transition:all .3s;user-select:none}
  .tb-btn:hover{color:var(--t2)}
  .tb-btn.active{color:#fff;background:linear-gradient(135deg,var(--primary),#4f6ae0);box-shadow:0 3px 16px var(--pr-glow)}
  .panel{display:none;animation:fs .4s cubic-bezier(.4,0,.2,1)}
  .panel.active{display:block}
  @keyframes fs{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:20px 24px;margin-bottom:14px;backdrop-filter:blur(10px);transition:border-color .3s}
  .card:hover{border-color:var(--border-h)}
  .ch{display:flex;align-items:center;gap:10px;margin-bottom:16px}
  .ch-s{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--primary),#4f6ae0);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;flex-shrink:0}
  .ch h3{font-size:14px;font-weight:600;letter-spacing:.15px}
  .fr{display:flex;gap:14px;flex-wrap:wrap}
  .fr>*{flex:1;min-width:180px}
  .fg{margin-bottom:14px}
  .fg:last-child{margin-bottom:0}
  .fg label{display:block;font-size:11px;font-weight:500;color:var(--t2);margin-bottom:6px;letter-spacing:.25px;text-transform:uppercase}
  .fg input[type="text"],input[type="file"]{width:100%;padding:10px 13px;border-radius:var(--rs);border:1px solid var(--border);background:rgba(0,0,0,.3);color:var(--t1);font-size:13px;font-family:inherit;transition:all .25s}
  .fg input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 2.5px var(--pr-glow)}
  .fg input[type="file"]{cursor:pointer}
  .fg input[type="file"]::file-selector-button{padding:5px 14px;border:none;border-radius:5px;background:linear-gradient(135deg,var(--primary),#4f6ae0);color:#fff;font-size:11px;font-weight:600;cursor:pointer;margin-right:10px;transition:opacity .2s}
  .fg input[type="file"]::file-selector-button:hover{opacity:.85}
  .hint{font-size:11px;color:var(--t3);margin-top:4px;font-style:italic}
  .rg{display:flex;align-items:center;gap:10px}
  .rg input[type="range"]{flex:1;-webkit-appearance:none;appearance:none;height:3px;border-radius:2px;background:linear-gradient(90deg,var(--primary),var(--accent));outline:none}
  .rg input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#fff;border:2px solid var(--primary);cursor:pointer;box-shadow:0 2px 6px rgba(99,125,255,.25);transition:transform .15s}
  .rg input[type="range"]::-webkit-slider-thumb:hover{transform:scale(1.12)}
  .rg input[type="range"]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#fff;border:2px solid var(--primary);cursor:pointer}
  .rv{min-width:24px;text-align:center;font-size:13px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
  .br{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
  .btn{position:relative;display:inline-flex;align-items:center;gap:7px;padding:11px 24px;border:none;border-radius:var(--rs);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:all .28s;user-select:none;overflow:hidden}
  .btn::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.08),transparent);opacity:0;transition:opacity .25s}
  .btn:hover::before{opacity:1}
  .btn:active{transform:scale(.97)}
  .btn:disabled{opacity:.3;cursor:not-allowed;transform:none}
  .btn-p{background:linear-gradient(135deg,var(--primary),#4f6ae0);color:#fff;box-shadow:0 3px 16px var(--pr-glow)}
  .btn-s{border:1px solid transparent}
  .btn-o{background:transparent;border:1px solid var(--border);color:var(--t2)}
  .btn-o:hover{border-color:var(--primary);color:var(--primary)}
  .pg{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
  @media(max-width:600px){.pg{grid-template-columns:1fr}}
  .pb{background:rgba(0,0,0,.3);border:1px solid var(--border);border-radius:var(--rs);padding:10px;text-align:center;transition:border-color .25s}
  .pb:hover{border-color:var(--border-h)}
  .pb .l{font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px}
  .pb img{max-width:100%;max-height:260px;border-radius:5px;display:block;margin:0 auto}
  .rc{margin-top:14px;padding:14px 18px;border-radius:var(--rs);border:1px solid transparent;animation:fs .25s ease}
  .rc.s{background:rgba(74,222,128,.07);border-color:rgba(74,222,128,.2)}
  .rc.e{background:rgba(248,113,113,.07);border-color:rgba(248,113,113,.2)}
  .rc.i{background:rgba(99,125,255,.07);border-color:rgba(99,125,255,.18)}
  .rc .rl{font-size:13px;font-weight:600;margin-bottom:5px}
  .rc .rd{font-size:12px;color:var(--t2);line-height:1.6;word-break:break-all}
  .rc .rd strong{color:var(--t1)}
  .ft{text-align:center;padding:24px 0 10px;color:var(--t3);font-size:11px;letter-spacing:.2px;opacity:.6}
  .info-bar{display:flex;gap:12px;flex-wrap:wrap;padding:12px 16px;margin-bottom:16px;background:rgba(99,125,255,.06);border:1px solid rgba(99,125,255,.12);border-radius:var(--rs);font-size:12px;color:var(--t2)}
  .info-bar strong{color:var(--t1)}
  @media(max-width:640px){
    .app{padding:16px 12px 30px}.header{padding:18px 0 22px}.logo-t{font-size:20px}
    .tb-btn{padding:8px 18px;font-size:12px}.card{padding:16px}.fr>*{min-width:100%}.br .btn{width:100%;justify-content:center}
  }
  .loading{display:inline-block;width:14px;height:14px;border:2.5px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:sp .6s linear infinite;vertical-align:middle;margin-right:6px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .ss{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.7);backdrop-filter:blur(8px);border:1px solid rgba(99,125,255,.2);border-radius:10px;padding:8px 16px;font-size:12px;color:var(--t2);pointer-events:none;opacity:0;transition:opacity .4s;z-index:999}
  .ss.show{opacity:1}
</style>
</head>
<body>
<div id="particles"></div>
<div class="app" id="_app">
  <div class="header">
    <div class="logo">
      <div class="logo-i">🔐</div>
      <span class="logo-t">StegaLoom Pro</span>
    </div>
    <p>基于 Cloudflare Workers 的专业暗水印工具 · 安全 · 高速</p>
  </div>
  <div class="info-bar" id="status-bar"><span>🟢 就绪</span></div>
  <div class="tb-wrap">
    <div class="tb">
      <button class="tb-btn active" data-tab="embed" id="tb-embed">✏️ 嵌入水印</button>
      <button class="tb-btn" data-tab="detect" id="tb-detect">🔎 检测水印</button>
    </div>
  </div>

  <div id="panel-embed" class="panel active">
    <div class="card">
      <div class="ch"><span class="ch-s">1</span><h3>上传原始图片</h3></div>
      <div class="fg"><input type="file" id="inp-img" accept="image/*"></div>
      <div class="hint">支持 PNG / JPEG / WebP · 图片经 Workers API 处理</div>
      <div class="pg" id="preview-box" style="display:none">
        <div class="pb"><div class="l">原始图片</div><img id="pv-orig"></div>
        <div class="pb" id="pv-wm-box" style="display:none"><div class="l">带水印图片</div><img id="pv-wm"></div>
      </div>
    </div>
    <div class="card">
      <div class="ch"><span class="ch-s">2</span><h3>水印参数</h3></div>
      <div class="fg">
        <label>水印文本</label>
        <input type="text" id="inp-text" value="暗水印测试专用" placeholder="输入要嵌入的暗水印文本">
      </div>
      <div class="fr">
        <div class="fg">
          <label>🔑 密码（可选）</label>
          <input type="text" id="inp-seed" placeholder="留空则不设密码">
          <div class="hint">设置密码后检测时必须一致</div>
        </div>
        <div class="fg">
          <label>位平面</label>
          <div class="rg">
            <input type="range" id="inp-bp" min="0" max="2" value="1" step="1" oninput="document.getElementById('bp-val').textContent=this.value">
            <span class="rv" id="bp-val">1</span>
          </div>
          <div class="hint">0=隐蔽 · 1=平衡（推荐） · 2=强鲁棒</div>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="ch"><span class="ch-s">3</span><h3>执行嵌入</h3></div>
      <div class="br">
        <button class="btn btn-p" id="btn-embed">⚡ 嵌入暗水印</button>
        <button class="btn btn-s" id="btn-dl" style="display:none">📥 下载带水印图片</button>
      </div>
      <div id="result-embed"></div>
    </div>
  </div>

  <div id="panel-detect" class="panel">
    <div class="card">
      <div class="ch"><span class="ch-s">1</span><h3>上传待检测图片</h3></div>
      <div class="fg"><input type="file" id="inp-det-img" accept="image/*"></div>
      <div class="pg" id="det-preview" style="display:none">
        <div class="pb"><div class="l">待检测图片</div><img id="pv-det"></div>
      </div>
    </div>
    <div class="card">
      <div class="ch"><span class="ch-s">2</span><h3>检测参数</h3></div>
      <div class="fr">
        <div class="fg">
          <label>🔑 密码</label>
          <input type="text" id="inp-det-seed" placeholder="嵌入时有密码则必填">
        </div>
        <div class="fg">
          <label>位平面</label>
          <div class="rg">
            <input type="range" id="inp-det-bp" min="0" max="2" value="1" step="1" oninput="document.getElementById('det-bp-val').textContent=this.value">
            <span class="rv" id="det-bp-val">1</span>
          </div>
        </div>
      </div>
      <div class="fg" style="margin-top:4px">
        <label><input type="checkbox" id="auto-scan-chk" checked> 智能扫描</label>
        <div class="hint">自动尝试 0-2 位平面 + 有/无密码组合</div>
      </div>
    </div>
    <div class="card">
      <div class="ch"><span class="ch-s">3</span><h3>提取水印</h3></div>
      <button class="btn btn-p" id="btn-detect">🔎 检测暗水印</button>
      <div id="result-detect"></div>
    </div>
  </div>
  <div class="ft"><span>StegaLoom Pro · 基于 Cloudflare Workers · 算法安全隔离</span></div>
</div>
<div class="ss" id="toast"></div>
