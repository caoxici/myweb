<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>暗水印工具</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh}
.container{max-width:1100px;margin:0 auto;padding:20px}
h1{font-size:24px;background:linear-gradient(135deg,#38bdf8,#818cf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;display:inline-block}
.sub{color:#94a3b8;margin-bottom:14px;font-size:13px}
.cr{font-size:11px;color:#475569;margin-top:2px}
.tabs{display:flex;gap:4px;margin-bottom:14px;background:#1e293b;border-radius:12px;padding:4px}
.tab{flex:1;padding:10px 16px;border:none;background:transparent;color:#94a3b8;cursor:pointer;border-radius:10px;font-size:14px;font-weight:500;transition:.2s}
.tab.active{background:#3b82f6;color:#fff}
.panel{display:none}.panel.active{display:block}
.card{background:#1e293b;border-radius:12px;padding:18px;margin-bottom:12px;border:1px solid #334155}
.ct{font-size:14px;font-weight:600;margin-bottom:12px;color:#f1f5f9}
.fg{margin-bottom:10px}.fg label{display:block;margin-bottom:4px;font-size:12px;color:#94a3b8;font-weight:500}
.fg input{width:100%;padding:8px 12px;border-radius:8px;border:1px solid #334155;background:#0f172a;color:#e2e8f0;font-size:13px}
.fg input[type='file']::file-selector-button{padding:5px 12px;border-radius:6px;border:1px solid #334155;background:#0f172a;color:#e2e8f0}
.fg select{width:100%;padding:8px 12px;border-radius:8px;border:1px solid #334155;background:#0f172a;color:#e2e8f0;font-size:13px}
.btn{padding:8px 20px;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;transition:.2s;margin-right:6px}
.btn-pri{background:#3b82f6;color:#fff}.btn-pri:hover{background:#2563eb}
.btn-suc{background:#22c55e;color:#fff}.btn-suc:hover{background:#16a34a}
.pva{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
.pvb{flex:1;min-width:180px;background:#0f172a;border-radius:8px;padding:8px;text-align:center}
.pvb img{max-width:100%;max-height:200px;border-radius:4px}
.pvb label{font-size:11px;color:#64748b;margin-bottom:4px;display:block}
.rbox{margin-top:10px;padding:12px;border-radius:8px;font-size:13px;line-height:1.6}
.rbox.ok{background:rgba(34,197,94,.1);border:1px solid #22c55e;color:#86efac}
.rbox.err{background:rgba(239,68,68,.1);border:1px solid #ef4444;color:#fca5a5}
.ft{text-align:center;padding:14px 0;font-size:12px;color:#475569;border-top:1px solid #1e293b;margin-top:20px}
.loader{display:flex;align-items:center;justify-content:center;min-height:100vh;color:#64748b;font-size:14px}
#app{display:none}
.disclaimer{margin-top:24px;padding:14px 18px;background:rgba(239,68,68,.06);border:1px solid rgba(239,68,68,.15);border-radius:10px;font-size:11px;line-height:1.7;color:#94a3b8}
.disclaimer strong{color:#f87171;font-size:12px}
</style>
</head>
<body>
<div id="loader" class="loader">🔒 加载安全组件...</div>
<div id="app">
<div class="container">
<h1>🌊 暗水印</h1>
<div class="sub">LSB最低位嵌入 · 完全隐形（肉眼不可见）<br><span class="cr">© 2026 Vaughn XI</span></div>
<div class="tabs">
<button class="tab active" data-p="embed">嵌入水印</button>
<button class="tab" data-p="detect">检测水印</button>
</div>
<div id="p-embed" class="panel active">
<div class="card"><div class="ct">1. 上传图片</div>
<div class="fg"><input type="file" id="e-f" accept="image/*"></div>
<div class="pva" id="e-pv" style="display:none">
<div class="pvb"><label>原图</label><img id="e-o"></div>
<div class="pvb"><label>水印图</label><img id="e-w"></div>
</div></div>
<div class="card"><div class="ct">2. 参数</div>
<div class="fg"><label>水印文本</label><input type="text" id="e-txt" value="加入暗水印测试专用"></div>
<div style="display:flex;gap:12px">
<div style="flex:1"><label>位平面</label><select id="e-bp"><option value="0">蓝色LSB (B通道1bit)</option><option value="1">蓝色2bit (B通道2bit)</option><option value="2">全色最低位 (RGB各1bit)</option></select></div>
<div style="flex:1"><label>种子</label><input type="number" id="e-seed" value="42" min="0" max="9999"></div>
</div></div>
<div class="card"><div class="ct">3. 执行</div>
<button class="btn btn-pri" onclick="W.goEmbed()">🔒 嵌入水印</button>
<button class="btn btn-suc" id="e-dl" style="display:none" onclick="W.dl()">📥 下载 PNG</button>
<div id="e-r"></div></div>
</div>
<div id="p-detect" class="panel">
<div class="card"><div class="ct">1. 上传图片</div>
<div class="fg"><input type="file" id="d-f" accept="image/*"></div>
<div class="pva" id="d-pv" style="display:none"><div class="pvb"><label>待检测</label><img id="d-img"></div></div></div>
<div class="card"><div class="ct">2. 检测参数</div>
<div style="display:flex;gap:12px">
<div style="flex:1"><label>位平面</label><select id="d-bp"><option value="0">蓝色LSB (B通道1bit)</option><option value="1">蓝色2bit (B通道2bit)</option><option value="2">全色最低位 (RGB各1bit)</option></select></div>
<div style="flex:1"><label>种子</label><input type="number" id="d-seed" value="42" min="0" max="9999"></div>
</div>
<button class="btn btn-pri" style="margin-top:10px" onclick="W.goDetect()">🔍 开始检测</button>
<div id="d-r"></div></div>
</div>
</div>
</div>
<div class="disclaimer">
<p><strong>免责声明：</strong></p>
<p>使用本站暗水印工具即视为您同意：本工具按“现状”提供，不保证水印完全隐蔽、一定能检出或不被破坏。您须承诺仅将工具用于合法目的（如内部版权保护、追溯），禁止用于非法跟踪、窃密或侵权等行为。因使用本工具产生的任何直接或间接损失、法律纠纷，本网站不承担任何责任。</p>
</div>
</div>
<script src="assets/loader.js"></script>
</body>
</html>
