<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>StegaLoom Pro · 暗水印工坊</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#080b14;--card:rgba(14,18,30,.88);--border:rgba(99,125,255,.1);--border-h:rgba(99,125,255,.3);--primary:#637dff;--pr-glow:rgba(99,125,255,.22);--accent:#60d0e8;--t1:#eef2ff;--t2:rgba(238,242,255,.5);--t3:rgba(238,242,255,.25);--r:16px;--rs:10px}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--t1);min-height:100vh;overflow-x:hidden;background-image:radial-gradient(ellipse 70% 50% at 50% -10%,rgba(99,125,255,.055),transparent),radial-gradient(ellipse 50% 40% at 80% 85%,rgba(96,208,232,.035),transparent)}
#pts{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.p{position:absolute;width:2px;height:2px;background:var(--primary);border-radius:50%;opacity:0;animation:flt linear infinite}
@keyframes flt{0%{transform:translateY(100vh)scale(0);opacity:0}10%{opacity:.4}90%{opacity:.4}100%{transform:translateY(-5vh)scale(1);opacity:0}}
.app{position:relative;z-index:1;max-width:960px;margin:0 auto;padding:28px 18px 40px}
.header{text-align:center;padding:30px 0 28px;position:relative}
.header::after{content:"";position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:100px;height:1px;background:linear-gradient(90deg,transparent,var(--primary),transparent)}
.lg{display:inline-flex;align-items:center;gap:10px;margin-bottom:8px}
.li{width:40px;height:40px;background:linear-gradient(135deg,var(--primary),var(--accent));border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:0 6px 24px var(--pr-glow)}
.lt{font-size:24px;font-weight:800;letter-spacing:-.3px;background:linear-gradient(135deg,#eef2ff,var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hp{color:var(--t2);font-size:13px;max-width:460px;margin:0 auto;line-height:1.5}
.tw{display:flex;justify-content:center;margin:22px 0 18px}
.tb{display:flex;gap:3px;background:rgba(255,255,255,.035);border:1px solid var(--border);border-radius:12px;padding:4px;backdrop-filter:blur(8px)}
.tbn{position:relative;padding:10px 28px;border:none;background:transparent;color:var(--t3);font-size:13px;font-weight:500;cursor:pointer;border-radius:8px;transition:all .3s;user-select:none;font-family:inherit}
.tbn:hover{color:var(--t2)}
.tbn.ac{color:#fff;background:linear-gradient(135deg,var(--primary),#4f6ae0);box-shadow:0 3px 16px var(--pr-glow)}
.pn{display:none;animation:fs .4s;animation-fill-mode:both}
.pn.ac{display:block}
@keyframes fs{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:20px 24px;margin-bottom:14px;backdrop-filter:blur(10px);transition:border-color .3s}
.ch{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.cs{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--primary),#4f6ae0);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;flex-shrink:0}
.ch h3{font-size:14px;font-weight:600}
.fr{display:flex;gap:14px;flex-wrap:wrap}
.fr>*{flex:1;min-width:180px}
.fg{margin-bottom:14px}
.fg:last-child{margin-bottom:0}
.fg label{display:block;font-size:11px;font-weight:500;color:var(--t2);margin-bottom:6px;letter-spacing:.25px;text-transform:uppercase}
.fg input[type="text"],input[type="file"]{width:100%;padding:10px 13px;border-radius:var(--rs);border:1px solid var(--border);background:rgba(0,0,0,.3);color:var(--t1);font-size:13px;font-family:inherit;transition:all .25s}
.fg input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 2.5px var(--pr-glow)}
.fg input[type="file"]{cursor:pointer}
.fg input[type="file"]::file-selector-button{padding:5px 14px;border:none;border-radius:5px;background:linear-gradient(135deg,var(--primary),#4f6ae0);color:#fff;font-size:11px;font-weight:600;cursor:pointer;margin-right:10px}
.ht{font-size:11px;color:var(--t3);margin-top:4px}
.rg{display:flex;align-items:center;gap:10px}
.rg input[type="range"]{flex:1;-webkit-appearance:none;appearance:none;height:3px;border-radius:2px;background:linear-gradient(90deg,var(--primary),var(--accent));outline:none}
.rg input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#fff;border:2px solid var(--primary);cursor:pointer;box-shadow:0 2px 6px rgba(99,125,255,.25)}
.rv{min-width:24px;text-align:center;font-size:13px;font-weight:700;color:var(--accent)}
.br{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
.btn{position:relative;display:inline-flex;align-items:center;gap:7px;padding:11px 24px;border:none;border-radius:var(--rs);font-size:13px;font-weight:600;cursor:pointer;transition:all .28s;user-select:none;overflow:hidden;font-family:inherit}
.btn:hover{opacity:.9}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.3;cursor:not-allowed;transform:none}
.bp{background:linear-gradient(135deg,var(--primary),#4f6ae0);color:#fff;box-shadow:0 3px 16px var(--pr-glow)}
.bo{background:transparent;border:1px solid var(--border);color:var(--t2)}
.pg{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
@media(max-width:600px){.pg{grid-template-columns:1fr}}
.pb{background:rgba(0,0,0,.3);border:1px solid var(--border);border-radius:var(--rs);padding:10px;text-align:center}
.pb .l{font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px}
.pb img{max-width:100%;max-height:260px;border-radius:5px;display:block;margin:0 auto}
.rc{margin-top:14px;padding:14px 18px;border-radius:var(--rs);animation:fs .25s;animation-fill-mode:both}
.rc.s{background:rgba(74,222,128,.07);border-color:rgba(74,222,128,.2)}
.rc.e{background:rgba(248,113,113,.07);border-color:rgba(248,113,113,.2)}
.rc .rl{font-size:13px;font-weight:600;margin-bottom:5px}
.rc .rd{font-size:12px;color:var(--t2);line-height:1.6}
.rc .rd strong{color:var(--t1)}
.ft{text-align:center;padding:24px 0 10px;color:var(--t3);font-size:11px;opacity:.6}
.sb{display:flex;gap:12px;flex-wrap:wrap;padding:12px 16px;margin-bottom:16px;background:rgba(99,125,255,.06);border:1px solid rgba(99,125,255,.12);border-radius:var(--rs);font-size:12px;color:var(--t2)}
.ld{display:inline-block;width:14px;height:14px;border:2.5px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:sp .6s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
.ss{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.7);backdrop-filter:blur(8px);border:1px solid rgba(99,125,255,.2);border-radius:10px;padding:8px 16px;font-size:12px;color:var(--t2);pointer-events:none;opacity:0;transition:opacity .4s;z-index:999}
.ss.show{opacity:1}
</style>
</head>
<body>
<div id="pts"></div>
<div class="app">
<div class="header"><div class="lg"><div class="li">🔐</div><span class="lt">StegaLoom Pro</span></div><p class="hp">基于 Cloudflare Workers 的专业暗水印工具</p></div>
<div class="sb" id="sb"><span>🟢 就绪</span></div>
<div class="tw"><div class="tb"><button class="tbn ac" data-tab="embed">✏️ 嵌入</button><button class="tbn" data-tab="detect">🔎 检测</button></div></div>

<div id="panel-embed" class="pn ac">
<div class="cd"><div class="ch"><span class="cs">1</span><h3>上传图片</h3></div><div class="fg"><input type="file" id="i1" accept="image/*"></div><div class="ht">支持 PNG/JPEG/WebP</div>
<div class="pg" id="pb" style="display:none"><div class="pb"><div class="l">原始</div><img id="po"></div><div class="pb" id="pw" style="display:none"><div class="l">带水印</div><img id="pw"></div></div></div>
<div class="cd"><div class="ch"><span class="cs">2</span><h3>参数</h3></div>
<div class="fg"><label>文本</label><input type="text" id="it" value="暗水印测试专用"></div>
<div class="fr"><div class="fg"><label>🔑 密码</label><input type="text" id="is" placeholder="可选"></div>
<div class="fg"><label>位平面</label><div class="rg"><input type="range" id="ib" min="0" max="2" value="1" step="1" oninput="document.getElementById("bv").textContent=this.value"><span class="rv" id="bv">1</span></div><div class="ht">0=隐蔽 1=平衡 2=强</div></div></div></div>
<div class="cd"><div class="ch"><span class="cs">3</span><h3>执行</h3></div>
<div class="br"><button class="btn bp" id="be">⚡ 嵌入</button><button class="btn bo" id="dl" style="display:none">📥 下载</button></div><div id="re"></div></div>
</div>

<div id="panel-detect" class="pn">
<div class="cd"><div class="ch"><span class="cs">1</span><h3>上传图片</h3></div><div class="fg"><input type="file" id="i2" accept="image/*"></div>
<div class="pg" id="dp" style="display:none"><div class="pb"><div class="l">待检测</div><img id="pd"></div></div></div>
<div class="cd"><div class="ch"><span class="cs">2</span><h3>参数</h3></div>
<div class="fr"><div class="fg"><label>🔑 密码</label><input type="text" id="ids" placeholder="可选"></div>
<div class="fg"><label>位平面</label><div class="rg"><input type="range" id="idb" min="0" max="2" value="1" step="1" oninput="document.getElementById("dbv").textContent=this.value"><span class="rv" id="dbv">1</span></div></div></div>
<div class="fg"><label><input type="checkbox" id="as" checked> 智能扫描</label></div></div>
<div class="cd"><div class="ch"><span class="cs">3</span><h3>提取</h3></div>
<button class="btn bp" id="bd">🔎 检测</button><div id="rd"></div></div>
</div>
<div class="ft">StegaLoom Pro · CF Workers</div>
</div>
