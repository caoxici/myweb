<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vaughn.C LAB · 科技进步·开拓AI新世界</title>
    <link rel="icon" type="image/jpeg" href="/website.jpg">
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="container">
    <header class="hero">
        <a href="/digital-watermark.html" class="watermark-link">暗水印工具（专业版）</a>
        <div class="typewriter">
            <h1 id="main-title">
                <span class="brand-cursive">Vaughn.C</span> 
                <span class="brand-lab">LAB</span>
            </h1>
        </div>
        <div class="subhead">科技进步·开拓AI新世界！</div>
    </header>
    <div class="content">
        <div class="team-section">
            <div class="team-header">
                <h2>🛠️ 开发团队</h2>
                <a href="/people.html" class="more-link">👥 全部成员 →</a>
            </div>
            <div id="team-container" class="team-grid">
                <div class="team-loading">⏳ 加载团队成员…</div>
            </div>
        </div>
        <div class="section-header">
            <div class="section-header-left">
                <h2>📑 近期文章</h2>
                <a href="/archive.html" class="all-posts-link">📂 全部文章 →</a>
            </div>
            <span class="badge" id="article-counter">加载中…</span>
        </div>
        <div id="articles-container" class="article-list">
            <div class="status-box">⏳ 正在加载实验室最新研究…</div>
        </div>
        <footer class="footer">
            <span>Vaughn.C LAB · 开放学术 · </span>
            <a href="/">首页</a> · 
            <span id="refresh-note">更新数据即刻刷新</span>
            <div id="copyright-notice" class="copyright"></div>
        </footer>
    </div>
</div>
<script>
    (function() {
        function setCopyright() {
            const currentYear = new Date().getFullYear();
            const startYear = 2026;
            let text = currentYear <= startYear ? `© ${startYear} Vaughn.C LAB. All Rights Reserved.` : `© ${startYear}–${currentYear} Vaughn.C LAB. All Rights Reserved.`;
            document.getElementById('copyright-notice').textContent = text;
        }
        setCopyright();
        const titleEl = document.getElementById('main-title');
        if (titleEl) titleEl.addEventListener('animationend', e => { if (e.animationName === 'typing') titleEl.classList.add('typed'); });

        const teamContainer = document.getElementById('team-container');
        function escapeHtml(text) {
            return String(text).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
        }
        function renderTeam(arr) {
            if (!arr.length) { teamContainer.innerHTML='<div class="team-loading">👥 暂无成员信息</div>'; return; }
            let html = '';
            arr.slice(0,15).forEach(p => {
                const name = p.name||'未知', title = p.title||'', summary = p.summary||'', filename = p.filename||'';
                const url = filename ? `/person.html?file=${encodeURIComponent(filename)}` : '#';
                html += `<div class="person-card"><div class="person-name"><a href="${escapeHtml(url)}">${escapeHtml(name)}</a></div><div class="person-title">${escapeHtml(title)}</div><div class="person-summary">${escapeHtml(summary)}</div></div>`;
            });
            teamContainer.innerHTML = html;
        }
        async function loadTeam() {
            try { const r = await fetch('/person.json?t='+Date.now()); const d = await r.json(); renderTeam(Array.isArray(d)?d:[]); }
            catch(e) { teamContainer.innerHTML='<div class="team-loading">⚠️ 人员数据加载失败</div>'; }
        }

        const articleContainer = document.getElementById('articles-container');
        const counterSpan = document.getElementById('article-counter');
        function formatDate(d) { if(!d) return ''; const p=d.split('-'); return p.length===3?`${p[0]}年${+p[1]}月${+p[2]}日`:d; }
        function formatAuthors(a) {
            if(!a) return '<span>未知作者</span>';
            return a.split(',').map(s=>`<a href="/author.html?name=${encodeURIComponent(s.trim())}" class="author-link">${escapeHtml(s.trim())}</a>`).join('<span class="author-separator">, </span>');
        }
        function formatTags(t) {
            if(!t||!Array.isArray(t)||!t.length) return '';
            return t.map(tag=>`<a href="/tag.html?tag=${encodeURIComponent(tag)}" class="tag-link">#${escapeHtml(tag)}</a>`).join('');
        }
        function renderArticles(arr) {
            if(!arr.length) { articleContainer.innerHTML='<div class="status-box">📭 暂无文章</div>'; counterSpan.textContent='0 篇'; return; }
            const sorted = [...arr].sort((a,b)=>(b.date||'').localeCompare(a.date||''));
            const recent = sorted.slice(0,10);
            counterSpan.textContent = `近 ${recent.length} 篇 · 最新`;
            let html = '';
            recent.forEach(item => {
                const title = item.title||'未命名', date = formatDate(item.date), summary = item.summary||'', filename = item.filename||'';
                const articleUrl = filename ? `/article.html?post=${encodeURIComponent(filename)}` : '#';
                const authorsHtml = formatAuthors(item.author);
                const tagsHtml = formatTags(item.tags||(item.tag?[item.tag]:[]));
                html += `<article class="article-card"><div class="article-meta">${date?`<span class="article-date">📅 ${date}</span>`:''}<div style="display:flex;flex-wrap:wrap;gap:0.3rem;">${tagsHtml}</div></div><div class="article-authors" style="margin-bottom:4px;">✍️ ${authorsHtml}</div><h3 class="article-title"><a href="${escapeHtml(articleUrl)}" target="_blank">${escapeHtml(title)}</a></h3><p class="article-summary">${escapeHtml(summary)}</p></article>`;
            });
            articleContainer.innerHTML = html;
        }
        async function loadArticles() {
            try { const r = await fetch('/posts.json?t='+Date.now()); const d = await r.json(); renderArticles(Array.isArray(d)?d:[]); }
            catch(e) { articleContainer.innerHTML='<div class="error-box">⚠️ 文章加载失败</div>'; }
        }

        loadTeam();
        loadArticles();
    })();
</script>
</body>
</html>
